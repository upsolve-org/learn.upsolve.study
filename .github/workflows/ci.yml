name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  static:
    name: Typecheck & lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run plugins:setup
      - run: npm run plugins:build-core
      - run: npm run typecheck
      - run: npm run lint:ox
      - run: npm run lint

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run plugins:setup
      - run: npm run plugins:build-core
      - run: npm test

  integration:
    name: Integration (Postgres 17 + RustFS)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.12-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: learn
          POSTGRES_USER: learn
          POSTGRES_PASSWORD: ci-test-password
        options: >-
          --health-cmd "pg_isready -U learn -d learn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rustfs:
        image: rustfs/rustfs:1.0.6
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: ci-access-key
          RUSTFS_SECRET_KEY: ci-secret-key
    env:
      HOSTED_MODE: "on"
      APP_ORIGIN: http://127.0.0.1:3000
      DATABASE_URL: postgresql://learn:ci-test-password@127.0.0.1:5432/learn
      STORAGE_BACKEND: postgres
      BETTER_AUTH_SECRET: ci-integration-test-secret-0123456789abcdef
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: learn-blobs-ci
      S3_ACCESS_KEY_ID: ci-access-key
      S3_SECRET_ACCESS_KEY: ci-secret-key
      S3_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - name: Wait for RustFS S3 endpoint
        shell: bash
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/ || true)
            if [[ "$code" != "000" ]]; then
              echo "RustFS ready (HTTP $code)"
              exit 0
            fi
            sleep 1
          done
          echo "RustFS did not become reachable on 127.0.0.1:9000"
          exit 1
      - run: npm ci
      - run: npm run plugins:setup
      - run: npm run plugins:build-core
      - run: npm run test:integration

  build-linux:
    name: Build & runtime smoke (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run plugins:setup
      - run: npm run build
      # Verify the fresh standalone trace confines native Pi SDK modules offline.
      - run: node scripts/smoke-provider-runtime.mjs
      # Verify the standalone pg-boss worker module graph loads cleanly under tsx.
      - run: node node_modules/tsx/dist/cli.mjs --import tsx -e "import('./scripts/worker.ts').then((m) => { if (typeof m.runQueuedJob !== 'function') process.exit(1); console.log('[ci] worker module OK'); })"
